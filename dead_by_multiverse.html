однять, снять с крюка · E — предмет (аптечка вкл/выкл, фонарик — светить в маньяка, карта) · маньяк: Q — способность, F/🪤 — поставить ловушку, G/1-3/⇄ — сменить ловушку · R — меню. На генераторе и рычаге скилл-чек: стоишь на месте, Пробел/⚔ в зелёной зоне.</p><p>Ур. 5: у выжившего открывается своя способность (Q / ✨) или предмет, у маньяка — свои улучшения (скорость перезарядки, невидимость и др.). Ловушек 19 видов, есть растяжка.</p><p>Новые предметы: мина (оглушает маньяка на 4 с) и святая вода (лечит всех рядом). В 🛒 Магазине за очки покупаются скины и оформления (Новый год, Хэллоуин и др.). 🤖 Квест «Робот»: заведи все 5 генераторов — у стола в доме появится ключ (его нельзя потратить), а 5 деталей будут спрятаны по карте: ищи блеск и жёлтые стрелки. Неси детали к столу, а с ключом удерживай ⚔ у стола, чтобы собрать робота. Сядь в него (подойди) и стреляй ракетами (⚔) — 5 попаданий убьют маньяка, и все выжившие сбегут. 🔫 На карте «Дом Рика и Морти» вместо робота собирают портальную пушку: те же 5 деталей, а вместо ключа — флакон с зелёной жидкостью. Подбери готовую пушку у стола и стреляй в маньяка (⚔) — 3 попадания отправят его в Мир Блендера, и выжившие победят.</p><p>🏠 Карта «Дом Рика и Морти»: есть второй выход без рычага и ворот. После того как заведены все 5 генераторов, почини <b>портальную пушку</b> в подвале (около 5 минут в одиночку, вдвоём и втроём быстрее) — в гараже Рика откроется зелёный портал, прыгай в него и сбегай. Ремкомплект, батарея и инструменты на ней тоже работают.</p><p>🚪 Онлайн-комнаты: создай комнату, отправь другу код и выбери героя. Матч запускается у всех после готовности игроков. Для связи нужен интернет.</p><p>Промокоды вводи в разделе «Коды».</p></details><button onclick="shop()" style="border-color:#fbbf24">🛒 Магазин · скины и оформления</button><button onclick="fs()">⛶ На весь экран (горизонтально)</button><h2>🗺 Карта</h2><div class="r">'+['🌲 Лунный лес','🏠 Дом Рика и Морти'].map((a,i)=>'<button onclick="setMap('+i+')" style="te
